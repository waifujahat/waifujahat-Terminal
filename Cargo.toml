[package]
name = "waifujahat-terminal"
version = "0.1.0"
edition = "2024"
description = "Native desktop terminal built with Rust and GPUI"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
portable-pty = "0.9.0"
vte = "0.15.0"
alacritty_terminal = { version = "=0.26.0", default-features = false }

[profile.dev]
debug = 0

[profile.test]
debug = 0

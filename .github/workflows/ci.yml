# Waifujahat Terminal
# Author : waifujahat
# Module : Infrastructure / Continuous Integration
# Purpose : Validates Windows builds and source code quality

name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt --component clippy

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          rustup override set $env:RUST_TOOLCHAIN

      - name: Display toolchain information
        run: |
          rustc -Vv
          cargo -V

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked

      - name: Check code quality
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build application
        run: cargo build --locked
